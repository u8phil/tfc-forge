[package]
name = "tfc-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local TerraFirmaCraft forge planner - native Rust rewrite (domain, solver, SQLite persistence)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tfc-forge-migration = { path = "migration" }
sea-orm = { version = "2.0.4", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
sea-query = "1.0.2"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
dirs = "7.0.0"
thiserror = "2.0.21"

# Native GUI and anvil screenshot recognition dependencies.
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36.2", default-features = false }
egui_extras = { version = "0.36.2", default-features = false, features = ["image"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
rfd = "0.17.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
fuzzy-matcher = "0.3.7"

[dev-dependencies]
tempfile = "3.24.0"

[workspace]
members = ["migration"]
resolver = "3"
